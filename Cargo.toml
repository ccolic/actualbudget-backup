[package]
name = "actualbudget-backup"
version = "1.0.1"
authors = ["Christian Colic <christian@colic.io>"]
edition = "2021"
description = "CLI Tool to download a backup from your Actual Budget instance, written in Rust"
documentation = "https://github.com/ccolic/actualbudget-backup"
readme = "README.md"
homepage = "https://github.com/ccolic/actualbudget-backup"
repository = "https://github.com/ccolic/actualbudget-backup"
license-file = "LICENSE"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
debug = false    # Exclude debug symbols for smaller binary size
lto = true       # Link-Time Optimization for further size reduction
opt-level = 3    # Maximum optimization for performance
panic = "abort"  # Use `abort` to reduce binary size further

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "*", features = ["vendored"] }
